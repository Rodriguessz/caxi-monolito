# Pipeline de Integração Contínua (CI) do Caxi.
# Roda em todo Pull Request para a main e em todo push na main.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O token do workflow só pode ler o repositório (menor privilégio).
permissions:
  contents: read

# Num PR, um push novo cancela a execução anterior, que ficou obsoleta.
# Na main, todas as execuções vão até o fim.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1. Análise do código, sem banco: rápida e barata.
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # histórico completo, para o gitleaks varrer todos os commits

      - name: Varredura de segredos (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --redact --verbose --log-opts="HEAD"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (exatamente as do lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test -- --ci

      - name: Dependências vulneráveis (produção, severidade alta ou crítica)
        run: npm audit --audit-level=high --omit=dev

      - name: Build
        run: npm run build

  # 2. Banco real: migrations e testes de integração.
  integracao:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4 # a mesma imagem do docker-compose.yml
        env:
          POSTGRES_USER: caxi
          POSTGRES_PASSWORD: caxi_ci # credencial descartável: o banco só existe durante o job
          POSTGRES_DB: caxi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U caxi -d caxi_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://caxi:caxi_ci@localhost:5432/caxi_test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Migrations do zero num banco vazio
        run: npm run migration:run

      - name: Migrations são reversíveis (revert e run de novo)
        run: npm run migration:revert && npm run migration:run

      - name: Testes de integração
        run: npm run test:integration -- --ci

  # 3. O ambiente reproduzível sobe do zero numa máquina limpa.
  ambiente-reproduzivel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Subir com Docker Compose (build das imagens + db + migrate + api + web)
        run: docker compose up --build -d --wait api web

      - name: Smoke test por HTTP
        run: |
          curl -fsS --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/api/health/ready
          curl -fsS http://localhost:3000/api/barracas/demo | grep -q '"slug":"demo"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/barracas/nao-existe)" = 404

      - name: Smoke test do front (SPA e encaminhamento de /api pelo nginx)
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/uma-rota-da-spa | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/barracas/demo | grep -q '"slug":"demo"'

      - name: Logs dos containers (só se algo falhar)
        if: failure()
        run: docker compose logs

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v
